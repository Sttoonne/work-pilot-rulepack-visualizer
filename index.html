      const addEndpoint = (nodeId, side, edgeIndex, role) => {
        const sideKey = JSON.stringify([nodeId, side]);
        if (!sideRoles.has(sideKey)) sideRoles.set(sideKey, new Set());
        sideRoles.get(sideKey).add(role);

        const roleKey = JSON.stringify([nodeId, side, role]);
        if (!roleGroups.has(roleKey)) {
          roleGroups.set(roleKey, { nodeId, side, role, edgeIndexes: [] });
        }
        roleGroups.get(roleKey).edgeIndexes.push(edgeIndex);
      };

      edges.forEach((edge, index) => {
        const from = layout.positions.get(edge.from);
        const to = layout.positions.get(edge.to);
        if (!from || !to) return;
        const sides = edgePortSides(layout, edge, index);
        addEndpoint(edge.from, sides.source, index, "source");
        addEndpoint(edge.to, sides.target, index, "target");
      });

      roleGroups.forEach(group => {
        const sideKey = JSON.stringify([group.nodeId, group.side]);
        const sharesSideWithOppositeRole = (sideRoles.get(sideKey) || new Set()).size > 1;
        const offset = sharesSideWithOppositeRole
          ? (group.role === "source" ? EDGE_OPPOSING_ROLE_OFFSET : -EDGE_OPPOSING_ROLE_OFFSET)
          : 0;
        group.edgeIndexes.forEach(edgeIndex => {
          result[edgeIndex][`${group.role}Offset`] = offset;
        });
      });

      return result;
    }

    function offsetHorizontalPort(port, distance) {
      if (port.side === "top" || port.side === "bottom") {
        return {
          x: port.x,
          y: port.y + (port.side === "bottom" ? distance : -distance),
          side: port.side
        };
      }
      return {
        x: port.x + (port.side === "right" ? distance : -distance),
        y: port.y,
        side: port.side
      };
    }

    function buildEdgeJunctions(edges, layout, ports) {
      const routing = edges.map(() => ({}));
      const groups = new Map();

      const addEndpoint = (nodeId, side, edgeIndex, role, port) => {
        const key = JSON.stringify([nodeId, side, role]);
        if (!groups.has(key)) {
          groups.set(key, { nodeId, side, role, port, edgeIndexes: [] });
        }
        groups.get(key).edgeIndexes.push(edgeIndex);
      };

      edges.forEach((edge, index) => {
        const from = layout.positions.get(edge.from);
        const to = layout.positions.get(edge.to);
        if (!from || !to) return;
        const sides = edgePortSides(layout, edge, index);
        const sourcePort = portForSide(from, ports[index].sourceOffset, sides.source);
        const targetPort = portForSide(to, ports[index].targetOffset, sides.target, EDGE_ARROW_CLEARANCE);
        addEndpoint(edge.from, sides.source, index, "source", sourcePort);
        addEndpoint(edge.to, sides.target, index, "target", targetPort);
      });

      const trunks = [];
      const junctions = [];
      groups.forEach(group => {
        if (group.edgeIndexes.length < 2) return;
        const junction = offsetHorizontalPort(group.port, EDGE_JUNCTION_GAP);
        group.edgeIndexes.forEach(edgeIndex => {
          routing[edgeIndex][group.role] = junction;
          routing[edgeIndex][`${group.role}Shared`] = true;
        });
        trunks.push({
          nodeId: group.nodeId,
          role: group.role,
          path: group.role === "source"
            ? `M ${group.port.x} ${group.port.y} L ${junction.x} ${junction.y}`
            : `M ${junction.x} ${junction.y} L ${group.port.x} ${group.port.y}`
        });
        junctions.push({
          nodeId: group.nodeId,
          role: group.role,
          x: junction.x,
          y: junction.y
        });
      });

      return { routing, trunks, junctions };
    }

    function syncZoomSurface() {
      if (!state.currentLayout) return;
      el.flowStage.style.width = `${state.currentLayout.width}px`;
      el.flowStage.style.height = `${state.currentLayout.height}px`;
      el.flowStage.style.transform = `scale(${state.zoom})`;
      el.flowViewport.style.width = `${state.currentLayout.width * state.zoom}px`;
      el.flowViewport.style.height = `${state.currentLayout.height * state.zoom}px`;
      syncEdgeVisualScale();
    }

    function setZoom(nextZoom, anchorEvent) {
      const oldZoom = state.zoom;
      const next = Math.max(0.25, Math.min(2, Math.round(nextZoom * 20) / 20));

      let contentX = 0;
      let contentY = 0;
      let pointerX = 0;
      let pointerY = 0;
      if (anchorEvent) {
        const rect = el.canvasShell.getBoundingClientRect();
        pointerX = anchorEvent.clientX - rect.left;
        pointerY = anchorEvent.clientY - rect.top;
        contentX = (el.canvasShell.scrollLeft + pointerX) / oldZoom;
        contentY = (el.canvasShell.scrollTop + pointerY) / oldZoom;
      }

      state.zoom = next;
      el.zoomRange.value = String(Math.round(next * 100));
      el.zoomValue.textContent = `${Math.round(next * 100)}%`;
      syncZoomSurface();

      if (anchorEvent) {
        el.canvasShell.scrollLeft = Math.max(0, contentX * next - pointerX);
        el.canvasShell.scrollTop = Math.max(0, contentY * next - pointerY);
      }
    }

    function fitGraphToViewport() {
      if (!state.currentLayout) return;
      const availableWidth = Math.max(240, el.canvasShell.clientWidth - 28);
      const availableHeight = Math.max(220, el.canvasShell.clientHeight - 28);
      const next = Math.min(1, availableWidth / state.currentLayout.width, availableHeight / state.currentLayout.height);
      setZoom(next);
      el.canvasShell.scrollLeft = 0;
      el.canvasShell.scrollTop = 0;
    }

    function renderGraph(wf) {
      const nodes = safeArray(wf.nodes);
      const edges = safeArray(wf.edges);
      const layout = buildNodeLayout(wf);
      const graphKey = `${state.activeWorkflowIndex}|${nodes.map(node => node.id).join(",")}|${edges.map(edge => `${edge.from}>${edge.to}`).join(",")}`;
      const shouldFit = state.currentGraphKey !== graphKey;
      state.currentGraphKey = graphKey;
      state.currentLayout = layout;
      const stage = el.flowStage;
      syncZoomSurface();

      stage.innerHTML = `<svg id="flowSvg" class="flow-svg flow-scene-svg" viewBox="0 0 ${layout.width} ${layout.height}" width="${layout.width}" height="${layout.height}"></svg>`;
      el.flowSvg = stage.querySelector("#flowSvg");

      const definitions = `
        <defs>
          <filter id="node-shadow" x="-20%" y="-35%" width="140%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1c3e4d" flood-opacity="0.07"></feDropShadow>
          </filter>
          <marker id="arrow-edge" markerWidth="${EDGE_ARROW_SIZE}" markerHeight="${EDGE_ARROW_SIZE}" viewBox="-1 -1 10 10" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse" overflow="visible">
            <path d="M1,1 L8,4 L1,7" fill="none" stroke="var(--graph-line)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
        </defs>`;
      const edgePorts = buildEdgePorts(edges, layout);
      const edgeJunctions = buildEdgeJunctions(edges, layout, edgePorts);
      const paths = edges.map((edge, index) => {
        const from = layout.positions.get(edge.from);
        const to = layout.positions.get(edge.to);
        if (!from || !to) return "";
        const route = edgeJunctions.routing[index];
        const geometry = edgePath(layout, edge, index, edgePorts[index], route);
        const color = edgeColor(edge);
        const marker = route.targetShared ? "" : ` marker-end="url(#arrow-edge)"`;
        return `
          <g style="color:${color}">
            <path class="edge-path edge-route" d="${geometry.path}" fill="none" stroke="currentColor" stroke-width="${EDGE_STROKE_WIDTH}" stroke-linecap="round" stroke-linejoin="round"${marker}></path>
          </g>`;
      }).join("");
      const trunkPaths = edgeJunctions.trunks.map(trunk => `
        <path class="edge-path edge-trunk edge-trunk-${trunk.role}" d="${trunk.path}" fill="none" stroke="var(--graph-line)" stroke-width="${EDGE_STROKE_WIDTH}" stroke-linecap="round" stroke-linejoin="round"${trunk.role === "target" ? ` marker-end="url(#arrow-edge)"` : ""}></path>
      `).join("");
      const junctionDots = edgeJunctions.junctions.map(junction => `
        <circle class="edge-junction edge-junction-${junction.role}" cx="${junction.x}" cy="${junction.y}" r="2.6"></circle>
      `).join("");

      const nodeMarkup = nodes.map(node => {
        const pos = layout.positions.get(node.id);
        if (!pos) return "";
        const requiredCount = safeArray(node.required_fields).length;
        const optionalCount = safeArray(node.optional_fields).length;
        const fieldCount = requiredCount + optionalCount;
        const fullLabel = text(node.name || node.id);
        const labelWidth = pos.w - 42 - (fieldCount ? 34 : 0);
        const displayLabel = truncateNodeLabel(fullLabel, labelWidth);
        const classes = [
          "svg-node-card",
          node.type === "start" ? "start" : node.type === "end" ? "end" : "",
          state.selectedNodeId === node.id ? "selected" : ""
        ].filter(Boolean).join(" ");
        return `
          <g class="${classes}" data-node-id="${escapeHtml(node.id)}" role="button" tabindex="0" aria-label="查看节点 ${escapeHtml(fullLabel)}">
            <title>${escapeHtml(fullLabel)}</title>
            <rect class="svg-node-shape" x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}" rx="${pos.h / 2}"></rect>
            <circle class="svg-node-dot" cx="${pos.x + 14}" cy="${pos.y + pos.h / 2}" r="5"></circle>
            <text class="svg-node-label" x="${pos.x + 26}" y="${pos.y + pos.h / 2 + 0.5}">${escapeHtml(displayLabel)}</text>
            ${fieldCount ? `
              <rect class="svg-node-count-bg" x="${pos.x + pos.w - 34}" y="${pos.y + 12}" width="24" height="24" rx="12"></rect>
              <text class="svg-node-count" x="${pos.x + pos.w - 22}" y="${pos.y + pos.h / 2 + 0.5}">${fieldCount}</text>
            ` : ""}
          </g>`;
      }).join("");

      el.flowSvg.innerHTML = `
        ${definitions}
        <g class="node-layer">${nodeMarkup}</g>
        <g class="edge-route-layer">${paths}</g>
        <g class="edge-trunk-layer">${trunkPaths}${junctionDots}</g>`;
      syncEdgeVisualScale();

      el.flowSvg.querySelectorAll(".svg-node-card").forEach(card => {
        const activate = () => {
          const nodeId = card.getAttribute("data-node-id");
          if (!nodeId) return;
          state.selectedNodeId = nodeId;
          state.previewTransitionKey = null;
          renderGraph(wf);
          renderNodeDetail(wf);
        };
        card.addEventListener("click", activate);
        card.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          activate();
        });
      });

      if (!nodes.length) {
        stage.insertAdjacentHTML("beforeend", `<div class="empty">当前 workflow 没有 nodes[]。</div>`);
      }
      if (shouldFit) requestAnimationFrame(fitGraphToViewport);
    }

    function fieldChip(fieldKey, fields) {
      const field = fields.get(fieldKey);
      const label = field ? `${field.name || fieldKey} (${fieldKey})` : fieldKey;
      return `<span class="chip">${escapeHtml(label)}</span>`;
    }

    function fieldOptions(field) {
      const source = safeArray(field.options).length
        ? safeArray(field.options)
        : safeArray(field.bitable && field.bitable.property && field.bitable.property.options);
      return source.map(option => typeof option === "string" ? option : option && option.name).filter(Boolean);
    }

    function renderPreviewControl(field, required) {
      const type = text(field.type).toLowerCase();
      const uiType = text(field.bitable && field.bitable.uiType).toLowerCase();
      const kind = `${type} ${uiType}`;
      const name = field.name || field.key || "未命名字段";
      const requiredAttr = required ? " required" : "";
      const aria = escapeHtml(name);

      if (kind.includes("checkbox") || type === "bool" || type === "boolean") {
        return `<label class="preview-check"><input type="checkbox" aria-label="${aria}"${requiredAttr} /> <span>是</span></label>`;
      }

      if (kind.includes("multiselect") || type === "multi_select") {
        const options = fieldOptions(field);
        return `<select class="preview-control" multiple size="${Math.min(4, Math.max(2, options.length || 2))}" aria-label="${aria}"${requiredAttr}>${options.map(option => `<option>${escapeHtml(option)}</option>`).join("") || '<option disabled>暂无可选项</option>'}</select>`;
      }

      if (kind.includes("singleselect") || type === "select") {
        const options = fieldOptions(field);
        return `<select class="preview-control" aria-label="${aria}"${requiredAttr}><option value="">请选择</option>${options.map(option => `<option>${escapeHtml(option)}</option>`).join("")}</select>`;
      }

      if (kind.includes("user") || type === "user") {
        return `<select class="preview-control" aria-label="${aria}"${requiredAttr}><option value="">选择成员</option></select>`;
      }

      if (kind.includes("link") || type === "relation" || type === "relation_multi") {
        const relationHint = type === "relation_multi" || kind.includes("multilink") ? "搜索并选择多个关联记录" : "搜索并选择关联记录";
        return `<input class="preview-control" type="text" aria-label="${aria}" placeholder="${relationHint}"${requiredAttr} />`;
      }

      if (kind.includes("datetime") || type === "date") {
        return `<input class="preview-control" type="date" aria-label="${aria}"${requiredAttr} />`;
      }

      if (kind.includes("attachment") || type === "attachment") {
        return `<input class="preview-control" type="file" aria-label="${aria}"${requiredAttr} />`;
      }

      if (kind.includes("url") || type === "url") {
        return `<input class="preview-control" type="url" aria-label="${aria}" placeholder="https://"${requiredAttr} />`;
      }

      if (kind.includes("number") || type === "number") {
        return `<input class="preview-control" type="number" aria-label="${aria}" placeholder="请输入数字"${requiredAttr} />`;
      }

      if (type === "rich_text" || /描述|说明|备注|结论|内容/.test(name)) {
        return `<textarea class="preview-control" aria-label="${aria}" placeholder="请输入${aria}"${requiredAttr}></textarea>`;
      }

      if (kind.includes("formula") || kind.includes("lookup")) {
        return `<input class="preview-control preview-readonly" type="text" value="系统自动计算" aria-label="${aria}" readonly />`;
      }

      return `<input class="preview-control" type="text" aria-label="${aria}" placeholder="请输入${aria}"${requiredAttr} />`;
    }

    function orderedOutgoingEdges(outgoing) {
      return safeArray(outgoing)
        .map((edge, index) => ({ edge, index }))
        .sort((left, right) => {
          const leftPriority = Number(left.edge && left.edge.priority);
          const rightPriority = Number(right.edge && right.edge.priority);
          const leftValue = Number.isFinite(leftPriority) ? leftPriority : Number.MAX_SAFE_INTEGER;
          const rightValue = Number.isFinite(rightPriority) ? rightPriority : Number.MAX_SAFE_INTEGER;
          return leftValue - rightValue || left.index - right.index;
        })
        .map(item => item.edge)
        .filter(Boolean);
    }

    function previewTransitionKey(edge) {
      if (!edge) return "";
      return [
        edgePolicyKey(edge),
        String(edge.priority ?? ""),
        JSON.stringify(edge.condition || null)
      ].join("|");
    }

    function resolvePreviewTransition(outgoing, selectedKey) {
      const ordered = orderedOutgoingEdges(outgoing);
      return ordered.find(edge => previewTransitionKey(edge) === selectedKey) || ordered[0] || null;
    }

    function renderTransitionChoices(selected, outgoing, nodes, fields, selectedKey = null) {
      const ordered = orderedOutgoingEdges(outgoing);

      if (!ordered.length) {
        return `
          <section class="preview-section preview-transition-section">
            <div class="preview-section-head"><h4>推进方向</h4><span class="badge">0 项</span></div>
            <div class="preview-transition-empty">当前节点没有离开流转，通常表示这是结束节点。</div>
          </section>`;
      }

      const groupName = `preview-transition-${selected.id || "node"}`;
      const activeEdge = resolvePreviewTransition(ordered, selectedKey);
      const activeKey = previewTransitionKey(activeEdge);
      const choices = ordered.map(edge => {
        const target = nodes.get(edge.to) || {};
        const targetName = target.name || edge.to || "未命名节点";
        const action = humanAction(edge);
        const title = !edge.action || action === "常规推进"
          ? `推进到「${targetName}」`
          : `${action} → 「${targetName}」`;
        const condition = humanCondition(edge.condition, fields);
        const inputContract = humanRequiredFields(target.required_fields, target.optional_fields, fields);
        const edgeKey = previewTransitionKey(edge);
        return `
          <label class="preview-transition-option">
            <input type="radio" name="${escapeHtml(groupName)}" value="${escapeHtml(edgeKey)}" data-preview-edge-key="${escapeHtml(edgeKey)}"${edgeKey === activeKey ? " checked" : ""} />
            <span class="preview-transition-copy">
              <span class="preview-transition-title">${escapeHtml(title)}</span>
              <span class="preview-transition-meta">${escapeHtml(condition)}</span>
              <span class="preview-transition-meta">${escapeHtml(inputContract)}</span>
            </span>
          </label>`;
      }).join("");

      return `
        <section class="preview-section preview-transition-section">
          <div class="preview-section-head"><h4>推进方向</h4><span class="badge">${ordered.length} 项</span></div>
          <div class="small">当前节点「${escapeHtml(selected.name || selected.id)}」，请选择一条规则允许的流转。</div>
          <div class="preview-transition-options">${choices}</div>
        </section>`;
    }

    function renderNodeForm(selected, fields, outgoing = [], nodes = new Map(), selectedKey = null) {
      const activeEdge = resolvePreviewTransition(outgoing, selectedKey);
      const targetNode = activeEdge ? nodes.get(activeEdge.to) : null;
      const requiredKeys = safeArray(targetNode && targetNode.required_fields);
      const optionalKeys = safeArray(targetNode && targetNode.optional_fields).filter(key => !requiredKeys.includes(key));
      const items = [
        ...requiredKeys.map(key => ({ key, required: true })),
        ...optionalKeys.map(key => ({ key, required: false }))
      ];
      const controls = items.map(item => {
        const field = fields.get(item.key) || { key: item.key, name: item.key, type: "unknown" };
        return `
          <div class="preview-field">
            <label class="preview-label">${escapeHtml(field.name || item.key)}${item.required ? '<span class="required-mark">*</span>' : ''}</label>
            ${renderPreviewControl(field, item.required)}
            <div class="small">${escapeHtml(item.key)} · ${escapeHtml(field.type || "unknown")}${item.required ? " · 必填" : " · 可选"}</div>
          </div>`;
      }).join("");
      const fieldSection = items.length
        ? `
          <section class="preview-section">
            <div class="preview-section-head"><h4>推进时填写</h4><span class="badge">${items.length} 项</span></div>
            <div class="form-preview-fields">${controls}</div>
          </section>`
        : `
          <section class="preview-section">
            <div class="preview-section-head"><h4>推进时填写</h4><span class="badge">0 项</span></div>
            <div class="preview-transition-empty">${activeEdge ? "所选推进方向没有配置需要用户填写的业务字段。" : "当前节点没有可执行的推进方向。"}</div>
          </section>`;
      const targetName = targetNode && (targetNode.name || targetNode.id);
      const previewTitle = targetName
        ? `${selected.name || selected.id} → ${targetName} · 推进表单`
        : `${selected.name || selected.id} · 操作预览`;
      const previewDescription = targetName
        ? `字段取自目标节点「${targetName}」的输入契约，与产品实际推进表单保持一致。`
        : "当前节点没有离开流转，不会生成推进表单。";
      return `
        <div class="form-preview">
          <div class="form-preview-head">
            <div><h3>${escapeHtml(previewTitle)}</h3><div class="small">${escapeHtml(previewDescription)}</div></div>
            <span class="badge">${items.length} 字段 · ${safeArray(outgoing).length} 方向</span>
          </div>
          ${renderTransitionChoices(selected, outgoing, nodes, fields, selectedKey)}
          ${fieldSection}
        </div>`;
    }

    function renderNodeDetail(wf) {
      const nodes = safeArray(wf.nodes);
      const nodesById = new Map(nodes.map(node => [node.id, node]));
      const fields = new Map(safeArray(wf.fields).map(field => [field.key, field]));
      const selected = nodes.find(node => node.id === state.selectedNodeId) || nodes[0];
      if (!selected) {
        el.selectedNodeBadge.textContent = "无节点";
        el.selectedNodeBadge.removeAttribute("title");
        el.nodeDetail.innerHTML = `<div class="empty">当前 workflow 没有节点。</div>`;
        return;
      }
      if (!state.selectedNodeId) state.selectedNodeId = selected.id;
      el.selectedNodeBadge.textContent = selected.id;
      el.selectedNodeBadge.title = selected.id;
      const incoming = safeArray(wf.edges).filter(edge => edge.to === selected.id);
      const outgoing = safeArray(wf.edges).filter(edge => edge.from === selected.id);
      el.nodeFieldsTab.classList.toggle("active", state.nodeDetailMode === "fields");
      el.nodeFormTab.classList.toggle("active", state.nodeDetailMode === "form");
      el.nodeFlowTab.classList.toggle("active", state.nodeDetailMode === "flow");

      if (state.nodeDetailMode === "form") {
        const activePreviewEdge = resolvePreviewTransition(outgoing, state.previewTransitionKey);
        state.previewTransitionKey = activePreviewEdge ? previewTransitionKey(activePreviewEdge) : null;
        el.nodeDetail.innerHTML = renderNodeForm(selected, fields, outgoing, nodesById, state.previewTransitionKey);
        el.nodeDetail.querySelectorAll(".preview-transition-option input").forEach(input => {
          input.addEventListener("change", () => {
            if (!input.checked) return;
            state.previewTransitionKey = input.dataset.previewEdgeKey || null;
            renderNodeDetail(wf);
          });
        });
        return;
      }

      if (state.nodeDetailMode === "flow") {
        const incomingExplain = incoming.length
          ? incoming.map(edge => renderEdgeExplanation(edge, "incoming", nodesById, fields)).join("")
          : '<div class="flow-explain-card"><strong>没有进入流转</strong><p>这个节点通常是开始节点，或者当前规则没有配置进入它的边。</p></div>';
        const outgoingExplain = outgoing.length
          ? outgoing.map(edge => renderEdgeExplanation(edge, "outgoing", nodesById, fields)).join("")
          : '<div class="flow-explain-card"><strong>没有离开流转</strong><p>这个节点通常是终点节点，或者当前规则没有配置从它离开的边。</p></div>';
        el.nodeDetail.innerHTML = `
          <div class="kv"><b>当前节点</b><div>${escapeHtml(selected.name || selected.id)}</div></div>
          <div class="flow-explain">
            <div class="flow-explain-section">
              <h3>进入这个节点</h3>
              ${incomingExplain}
            </div>
            <div class="flow-explain-section">
              <h3>从这个节点离开</h3>
              ${outgoingExplain}
            </div>
          </div>
        `;
        return;
      }

      el.nodeDetail.innerHTML = `
        <div class="kv"><b>节点名称</b><div>${escapeHtml(selected.name || selected.id)}</div></div>
        <div class="kv"><b>节点类型</b><div>${escapeHtml(selected.type || "normal")}</div></div>
        <div class="kv"><b>负责人角色</b><div>${escapeHtml(selected.owner_role || "未配置")}</div></div>
        <div class="kv"><b>必要输入字段</b><div class="chips">${safeArray(selected.required_fields).map(key => fieldChip(key, fields)).join("") || '<span class="small">无</span>'}</div></div>
        <div class="kv"><b>可选输入字段</b><div class="chips">${safeArray(selected.optional_fields).map(key => fieldChip(key, fields)).join("") || '<span class="small">无</span>'}</div></div>
        <div class="kv"><b>流转数量</b><div class="chips"><span class="chip">${incoming.length} 条进入</span><span class="chip">${outgoing.length} 条离开</span></div></div>
      `;
    }

    function renderTransitions(wf) {
      const nodes = new Map(safeArray(wf.nodes).map(node => [node.id, node]));
      const fields = new Map(safeArray(wf.fields).map(field => [field.key, field]));
      const rows = safeArray(wf.edges).map(edge => {
        const from = nodes.get(edge.from);
        const to = nodes.get(edge.to);
        const required = safeArray(to && to.required_fields).map(key => {
          const field = fields.get(key);
          return field ? `${field.name} (${key})` : key;
        }).join("，");
        return `
          <tr>
            <td><strong>${escapeHtml(from ? from.name : edge.from)}</strong><div class="mono">${escapeHtml(edge.from)}</div></td>
            <td><strong>${escapeHtml(to ? to.name : edge.to)}</strong><div class="mono">${escapeHtml(edge.to)}</div></td>
            <td>${escapeHtml(edge.action || "")}</td>
            <td>${escapeHtml(summarizeCondition(edge.condition) || "无")}</td>
            <td>${escapeHtml(required || "无")}</td>
            <td>${escapeHtml(summarizeEffects(edge.effects) || "无")}</td>
          </tr>`;
      }).join("");
      el.transitionTable.innerHTML = `
        <table>
          <thead><tr><th>来源节点</th><th>目标节点</th><th>动作</th><th>条件</th><th>目标节点必填</th><th>流转效果</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">当前 workflow 没有 edges[]。</td></tr>'}</tbody>
        </table>`;
    }

    function renderFields(wf) {
      const q = el.fieldSearch.value.trim().toLowerCase();
      const fields = safeArray(wf.fields).filter(field => {
        if (!q) return true;
        const hay = `${field.key || ""} ${field.name || ""} ${field.type || ""} ${field.sourceColumn || ""} ${field.bitable && field.bitable.uiType || ""}`.toLowerCase();
        return hay.includes(q);
      });
      el.fieldCountBadge.textContent = `${fields.length} 个字段`;
      const rows = fields.map(field => {
        const uiType = field.bitable && field.bitable.uiType || "";
        const options = field.options || (field.bitable && field.bitable.property && field.bitable.property.options || []);
        const optionText = safeArray(options).map(opt => typeof opt === "string" ? opt : opt.name || JSON.stringify(opt)).join("，");
        return `
          <tr>
            <td><strong>${escapeHtml(field.name || "")}</strong>${field.sourceColumn ? `<div class="small">来源列: ${escapeHtml(field.sourceColumn)}</div>` : ""}</td>
            <td class="mono">${escapeHtml(field.key || "")}</td>
            <td>${escapeHtml(field.type || "")}</td>
            <td>${escapeHtml(uiType)}</td>
            <td>${field.required_on_create ? '<span class="badge warn">创建必填</span>' : ''}${field.statusField ? '<span class="badge ok">状态字段</span>' : ''}</td>
            <td>${escapeHtml(optionText || "")}</td>
          </tr>`;
      }).join("");
      el.fieldTable.innerHTML = `
        <table>
          <thead><tr><th>字段名</th><th>key</th><th>类型</th><th>飞书 uiType</th><th>标记</th><th>选项/说明</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">没有匹配字段。</td></tr>'}</tbody>
        </table>`;
    }

    function renderRaw(wf) {
      const summary = {
        rulePackId: state.rulepack && state.rulepack.rulePackId,
        schemaVersion: state.rulepack && state.rulepack.schemaVersion,
        workflow: {
          rulePackId: wf.rulePackId,
          workflowType: wf.workflowType,
          name: wf.name,
          fields: safeArray(wf.fields).map(field => ({ key: field.key, name: field.name, type: field.type, uiType: field.bitable && field.bitable.uiType })),
          nodes: safeArray(wf.nodes).map(node => ({ id: node.id, name: node.name, type: node.type, required_fields: node.required_fields, optional_fields: node.optional_fields })),
          edges: safeArray(wf.edges).map(edge => ({ from: edge.from, to: edge.to, action: edge.action, condition: edge.condition, effects: edge.effects }))
        }
      };
      el.rawSummary.textContent = JSON.stringify(summary, null, 2);
    }

    function setView(viewName) {
      document.querySelectorAll(".section-tabs .tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === viewName);
      });
      document.querySelectorAll(".view").forEach(view => view.classList.add("hidden"));
      document.getElementById(`${viewName}View`).classList.remove("hidden");
      if (viewName === "fields") renderFields(activeWorkflow() || {});
    }

    function loadSample() {
      const sample = {
        schemaVersion: "work-pilot-project-rulepack/v1-lite",
        rulePackId: "demo-project-rulepack",
        version: 1,
        workflows: [{
          rulePackId: "demo-demand",
          workflowType: "demand",
          name: "示例需求流程",
          fields: [
            { key: "title", name: "需求名称", type: "text", required_on_create: true, bitable: { uiType: "Text", property: {} } },
            { key: "current_owner", name: "需求负责人", sourceColumn: "当前负责人", type: "user", bitable: { uiType: "User", property: { multiple: false } } },
            { key: "priority", name: "优先级", type: "select", options: ["高", "中", "低"], bitable: { uiType: "SingleSelect", property: { options: [{ name: "高" }, { name: "中" }, { name: "低" }] } } },
            { key: "needs_testing", name: "需要提测", type: "bool", bitable: { uiType: "Checkbox", property: {} } }
          ],
          nodes: [
            { id: "review", name: "需求评审", type: "start", owner_role: "pm", required_fields: ["title"], optional_fields: ["priority", "needs_testing"] },
            { id: "dev", name: "实现中", type: "normal", owner_role: "dev", required_fields: [], optional_fields: ["current_owner"] },
            { id: "test", name: "测试中", type: "normal", owner_role: "tester", required_fields: [], optional_fields: [] },
            { id: "done", name: "已完成", type: "end", owner_role: "pm", required_fields: [], optional_fields: [] }
          ],
          edges: [
            { from: "review", to: "dev", effects: [{ type: "set_status", field: "status", value: "实现中" }] },
            { from: "dev", to: "test", condition: { field: "needs_testing", op: "eq", value: true }, effects: [{ type: "append_audit_log" }] },
            { from: "dev", to: "done", condition: { field: "needs_testing", op: "eq", value: false }, effects: [{ type: "append_audit_log" }] },
            { from: "test", to: "done", action: "accept", effects: [{ type: "append_audit_log" }] },
            { from: "test", to: "dev", action: "reject", effects: [{ type: "append_audit_log" }] }
          ],
          table: { main: { logicalKey: "demand_main", defaultName: "需求主表", fieldRefs: "all" }, systemFields: ["rulePackId", "rulePackVersion", "workflowType", "currentNode", "currentOwner", "status"] }
        }]
      };
      parseRulepack(JSON.stringify(sample, null, 2), "内置示例");
    }

    el.fileInput.addEventListener("change", async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const content = await file.text();
      parseRulepack(content, file.name);
    });

    el.dropzone.addEventListener("dragover", event => {
      event.preventDefault();
      el.dropzone.classList.add("dragover");
    });
    el.dropzone.addEventListener("dragleave", () => el.dropzone.classList.remove("dragover"));
    el.dropzone.addEventListener("drop", async event => {
      event.preventDefault();
      el.dropzone.classList.remove("dragover");
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      const content = await file.text();
      parseRulepack(content, file.name);
    });

    el.parsePasteBtn.addEventListener("click", () => {
      parseRulepack(el.pasteArea.value, "粘贴内容");
    });

    el.loadSampleBtn.addEventListener("click", loadSample);

    document.querySelectorAll(".section-tabs .tab").forEach(btn => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });

    el.nodeFieldsTab.addEventListener("click", () => {
      state.nodeDetailMode = "fields";
      renderNodeDetail(activeWorkflow() || {});
    });

    el.nodeFormTab.addEventListener("click", () => {
      state.nodeDetailMode = "form";
      renderNodeDetail(activeWorkflow() || {});
    });

    el.nodeFlowTab.addEventListener("click", () => {
      state.nodeDetailMode = "flow";
      renderNodeDetail(activeWorkflow() || {});
    });

    el.fieldSearch.addEventListener("input", () => renderFields(activeWorkflow() || {}));

    el.zoomRange.addEventListener("input", () => setZoom(Number(el.zoomRange.value) / 100));

    el.fitBtn.addEventListener("click", () => {
      fitGraphToViewport();
    });

    el.fullscreenBtn.addEventListener("click", async () => {
      if (document.fullscreenElement === el.graphView) {
        await document.exitFullscreen();
        return;
      }
      await el.graphView.requestFullscreen();
    });

    document.addEventListener("fullscreenchange", () => {
      const active = document.fullscreenElement === el.graphView;
      el.fullscreenBtn.textContent = active ? "退出全屏" : "⛶ 全屏";
      el.fullscreenBtn.setAttribute("aria-pressed", String(active));
      requestAnimationFrame(fitGraphToViewport);
    });

    el.canvasShell.addEventListener("wheel", event => {
      if (document.fullscreenElement !== el.graphView || !event.ctrlKey) return;
      event.preventDefault();
      setZoom(state.zoom + (event.deltaY < 0 ? 0.1 : -0.1), event);
    }, { passive: false });

    renderAll();
  </script>
</body>
</html>
